<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sales Enquiry Agent</title><link rel="stylesheet" href="/static/style.css"><script defer src="/static/app.js"></script></head>
<body><header><strong>Sales Enquiry Agent</strong><a href="/docs">API docs ↗</a></header><main><section class="intro"><h1>From enquiry to lead.</h1><p>Extract lead details and review them before writing to the sandbox CRM.</p></section>
<div class="workspace"><section class="panel"><form id="intake"><label for="message">Incoming enquiry</label><textarea id="message" required minlength="12" maxlength="4000"></textarea><div class="actions"><button>Prepare draft</button></div></form><p id="status" role="status"></p>
<form id="review" hidden><h2>Review lead</h2><label for="name">Contact name</label><input id="name" maxlength="120" required><label for="email">Email</label><input id="email" type="email" maxlength="120" required><label for="interest">Interest</label><input id="interest" maxlength="120" required><p id="followup"></p><button>Approve CRM write</button></form></section>
<aside><h2>Example enquiry</h2><button id="example">Load sample ↗</button><p>Use synthetic contacts. Follow-ups are drafted for review in this workspace.</p></aside></div></main></body></html>
